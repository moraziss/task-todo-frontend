name: ci

on:
  push:
    branches: [main]
    paths: ['Frontend/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['Frontend/**', '.github/workflows/ci.yml']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
