name: task_todo
description: "A Offline-First Todo App with Go backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Базовые пакеты для работы приложения
  provider: ^6.1.2
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  uuid: ^4.3.3
  intl: ^0.19.0

  # Пакеты для работы с файлами
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true